[package]
name = "airlock"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Expose a stdio MCP server over authenticated Streamable HTTP."
repository = "https://github.com/mkusaka/airlock"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net", "signal"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
reqwest = "0.13.5"
rmcp = { version = "3.6.0", features = ["client", "transport-streamable-http-client-reqwest"] }
